<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · SynKitab</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0d">
<!-- Absolute paths throughout: GitHub Pages serves this for any missing
     path, including nested ones like /a/b/c, where "logo.png" would miss. -->
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#ededeb; --muted:#a8a8a3; --faint:#6f6f6a; --accent:#5b9bd9; --brand:#1357e0;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.glow{position:fixed;inset:-20% -10% auto;height:640px;pointer-events:none;
  background:radial-gradient(520px 300px at 70% 30%,rgba(19,87,224,.32),transparent 70%),
             radial-gradient(460px 260px at 20% 10%,rgba(91,155,217,.14),transparent 70%)}
header{position:relative;border-bottom:1px solid var(--line)}
header .wrap,main,footer .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header .wrap{height:64px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand img{width:30px;height:30px;border-radius:8px}
main{position:relative;flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-top:64px;padding-bottom:64px}
.code{font-size:14px;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;background:rgba(255,255,255,.03)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,7vw,76px);line-height:1.04;letter-spacing:-.025em;margin:20px 0 16px;text-wrap:balance}
h1 em{font-style:italic;background:linear-gradient(100deg,#9cc4ff 0%,var(--accent) 45%,#2d6ff0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);font-size:clamp(16px,1.6vw,18.5px);max-width:40ch}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{display:inline-flex;align-items:center;border-radius:999px;font-weight:600;font-size:15px;padding:12px 22px;transition:transform .15s ease,background .2s ease,border-color .2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(180deg,#2d6ff0,var(--brand));color:#fff;box-shadow:0 8px 30px -8px rgba(19,87,224,.7)}
.btn-ghost{border:1px solid var(--line2);background:rgba(255,255,255,.03)}
.btn-ghost:hover{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.06)}
footer{position:relative;border-top:1px solid var(--line);padding:26px 0;color:var(--faint);font-size:13.5px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 22px}
footer a:hover{color:var(--text)}
@media (max-width:520px){.actions{align-self:stretch}.btn{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<header>
  <div class="wrap">
    <a class="brand" href="/"><img src="/logo.png" alt="">SynKitab</a>
  </div>
</header>

<main>
  <span class="code">404</span>
  <h1>This page is <em>not on the shelf.</em></h1>
  <p>The link may be old, or the address has a typo. Everything SynKitab offers is one click from the home page.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">Back to SynKitab</a>
    <a class="btn btn-ghost" href="/#download">Download</a>
    <a class="btn btn-ghost" href="https://reader.synkitab.com/">Open the web reader</a>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 SynKitab</span>
    <a href="https://api.synkitab.com/privacy">Privacy policy</a>
    <a href="https://api.synkitab.com/delete-account">Delete your account</a>
    <a href="https://api.synkitab.com/report">Report a broken link</a>
  </div>
</footer>
</body>
</html>
