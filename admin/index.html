<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- No inline script anywhere: script-src names this folder and one exact,
     hash-pinned file, so injected markup cannot run code. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js; style-src 'unsafe-inline'; img-src 'self'; connect-src https://fpldqluwkcwygkbabmys.supabase.co; base-uri 'none'; form-action 'none'">
<title>SynKitab Admin</title>
<link rel="icon" href="../logo.png">
<!-- The page is public; the numbers are not. admin_metrics() refuses anyone
     who is not in app_admins, so hiding this URL protects nothing and is not
     relied on. -->
<style>
html{display:none}
:root{
  --bg:#0b0b0d; --card:#16161a; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#ededeb; --muted:#a8a8a3; --faint:#6f6f6a; --accent:#5b9bd9; --brand:#1357e0; --bad:#e5736b;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
header img{width:28px;height:28px;border-radius:7px}
header h1{font-size:18px;font-weight:700}
header .who{margin-left:auto;color:var(--faint);font-size:13px}
button,input{font:inherit}
button{cursor:pointer;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--text);padding:8px 16px}
button.primary{background:var(--brand);border-color:var(--brand);font-weight:600}
input{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:10px;color:var(--text);padding:10px 12px}
#signin{max-width:340px;margin:12vh auto 0;display:grid;gap:12px}
#signin p{color:var(--muted);font-size:14px}
.err{color:var(--bad);font-size:14px;min-height:1.5em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.k{color:var(--muted);font-size:13px}
.v{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.s{color:var(--faint);font-size:12.5px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:12px}
.card h2{font-size:14px;font-weight:600;margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}
.bar{flex:1;min-width:2px;background:var(--accent);border-radius:3px 3px 0 0;position:relative}
.bar:hover{background:#9cc4ff}
.bar.zero{background:var(--line2);height:2px!important}
.axis{display:flex;justify-content:space-between;color:var(--faint);font-size:11.5px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:5px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
footer{color:var(--faint);font-size:12.5px;margin-top:20px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="../logo.png" alt="">
    <h1>SynKitab Admin</h1>
    <span class="who" id="who"></span>
    <button id="refresh">Refresh</button>
    <button id="out" hidden>Sign out</button>
  </header>

  <form id="signin" hidden>
    <p>Sign in with the owner account.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button>
    <button type="button" id="google">Continue with Google</button>
    <div class="err" id="err"></div>
  </form>

  <main id="dash" hidden>
    <div class="grid" id="kpis"></div>
    <div class="charts">
      <div class="card"><h2>New installs, last 30 days</h2><div class="bars" id="c-installs"></div><div class="axis" id="a-installs"></div></div>
      <div class="card"><h2>Club members active each week</h2><div class="bars" id="c-clubs"></div><div class="axis" id="a-clubs"></div></div>
      <div class="card"><h2>New accounts each week</h2><div class="bars" id="c-signups"></div><div class="axis" id="a-signups"></div></div>
    </div>
    <div class="charts">
      <div class="card"><h2>Platforms, last 30 days</h2><table id="t-platforms"></table></div>
      <div class="card"><h2>Versions, last 7 days</h2><table id="t-versions"></table></div>
    </div>
    <footer id="foot"></footer>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
        integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"
        crossorigin="anonymous"></script>
<script src="admin.js"></script>
</body>
</html>
